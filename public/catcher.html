<!doctype html>
<html lang="ko" class="wide">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잡는 사람 · 금고 털이 작전</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <h1>🚓 잡는 사람</h1>

      <a class="btn small ghost" href="/investigator">수사관</a>
      <button class="btn small light" id="logout" type="button">로그아웃</button>

  </div>
  <div class="shell-body catch-grid">

      <div id="escape" class="escape-list scroll-y"></div>
    </div>
    <div>
      <h2>🚨 최근 체포</h2>
      <div id="arrested" class="scroll-y"></div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/catcher.js"></script>
