<!doctype html>
<html lang="ko" class="wide">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전체 현황판 · 금고 털이 작전</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="board">
<div class="shell board-wrap">
  <div class="topbar">
    <h1 class="board-title">💰 금고 털이 작전</h1>
    <div class="board-qtotal" id="qTotal">대기 0팀</div>
    <div class="muted board-clock" id="clock"></div>
  </div>
  <div class="board-grid shell-body">
    <div class="board-queue-col">
      <div class="bq-head">
        <h2>⏳ 대기열</h2>
        <div class="muted bq-hint" id="qHint"></div>
      </div>
      <div id="queue"></div>
    </div>
    <div class="board-side">
      <h2>🎬 지금 진행 중</h2>
      <div id="live"></div>
      <h2>📊 누적 결과 <span class="muted" id="teams"></span></h2>
      <div class="ratio" id="ratio"></div>
      <div class="kpis kpis-all">
        <div class="kpi cc"><div class="v" id="kCC">0</div><div class="l">🤐🤐 협력</div></div>
        <div class="kpi mx"><div class="v" id="kMX">0</div><div class="l">🤐🗣️ 엇갈림</div></div>
        <div class="kpi dd"><div class="v" id="kDD">0</div><div class="l">🗣️🗣️ 배반</div></div>
        <div class="kpi"><div class="v coins" id="kRet">0</div><div class="l">🍬 캔디</div></div>
      </div>
      <h2>🧾 최근 판결</h2>
      <div id="recent" class="card"></div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  'use strict';
  var VH = window.VH, $ = VH.$, esc = VH.esc;
  var socket = io({ transports: ['websocket', 'polling'] });
  VH.connBanner(socket);
  var data = null;
  socket.on('connect', function () { socket.emit('board:watch'); });
  socket.on('board:data', function (d) { data = d; VH.syncNow(d.now); render(); });
  function queueLimit() {
    var h = window.innerHeight;
    if (h >= 1040) return 8;
    if (h >= 880) return 7;
    if (h >= 790) return 6;
    return 5;
  }
  function formatWait(ms) {
    var n = Number(ms);
    if (!Number.isFinite(n) || n <= 20 * 1000) return '곧 시작';
    return '약 ' + Math.max(1, Math.round(n / 60000)) + '분';
  }
  function render() {
    var q = data.sessions.filter(function (s) { return s.phase === 'waiting'; })
      .sort(function (a, b) { return (a.queuePos < 0 ? 999 : a.queuePos) - (b.queuePos < 0 ? 999 : b.queuePos); });
    $('qTotal').textContent = '대기 ' + q.length + '팀';
    var avgMin = Math.max(1, Math.round((data.avgSessionSec || 480) / 60));
    $('qHint').textContent = q.length ? '한 판 약 ' + avgMin + '분 기준' : '';
    var limit = queueLimit();
    var shown = q.slice(0, limit);
    var more = q.length - shown.length;
    if (!q.length) {
      $('queue').innerHTML = '<div class="bq-empty">지금 대기 중인 팀이 없어요</div>';
    } else {
      $('queue').innerHTML = shown.map(function (s, i) {
        var wait = formatWait(s.waitMs);
        var cls = 'bq-item' + (i === 0 ? ' next' : '');
        return '<div class="' + cls + '"><div class="bq-no">' + (i + 1) + '</div>' +
          '<div class="bq-name">' + esc(s.teamName) + '</div>' +
          '<div class="bq-wait">' + wait + '</div></div>';
      }).join('') + (more > 0 ? '<div class="bq-more">+' + more + '팀 더</div>' : '');
    }
    var live = data.sessions.filter(function (s) { return s.phase !== 'waiting'; });
    $('live').innerHTML = live.length ? live.map(function (s) {
      var at = s.phaseAt[s.phase];
      var extra = '';
      if (s.verdict) extra = '<div class="bsess-ver">' + [0, 1].map(function (i) { return '<span class="c' + s.verdict.choices[i] + '">' + VH.CHOICE_EMOJI[s.verdict.choices[i]] + ' ' + VH.CHOICE_SHORT[s.verdict.choices[i]] + '</span>'; }).join(' vs ') + '</div>';
      return '<div class="bsess"><div class="nm">' + esc(s.teamName) + '</div>' + extra +
        '<div class="bsess-right">' + VH.phaseBadge(s.phase) + '<div class="timer" data-at="' + at + '" data-ph="' + s.phase + '">' + VH.elapsed(VH.serverNow() - at) + '</div></div></div>';
    }).join('') : '<div class="card muted center bsess-empty">진행 중인 팀이 없어요</div>';
    var st = data.stats, tot = st.cooperate + st.betray;
    var cp = tot ? Math.round(st.cooperate / tot * 100) : 0;
    $('teams').textContent = '(' + st.teams + '팀 · ' + tot + '명)';
    $('ratio').innerHTML = tot ? '<div class="c" style="width:' + cp + '%">' + (cp >= 12 ? '🤐 협력 ' + cp + '%' : '') + '</div><div class="d" style="width:' + (100 - cp) + '%">' + (100 - cp >= 12 ? '🗣️ 배반 ' + (100 - cp) + '%' : '') + '</div>' : '<div style="width:100%;color:#9aa3b8">아직 결과가 없어요</div>';
    $('kCC').textContent = st.bothCooperate; $('kMX').textContent = st.mixed; $('kDD').textContent = st.bothBetray;
    $('kRet').textContent = st.candies;
    var recent = (st.recent || []).slice(0, 4);
    $('recent').innerHTML = recent.length ? recent.map(function (r) {
      return '<div class="recent-row"><span>' + esc(r.team) + ' <span class="muted">' + VH.clock(r.at) + '</span></span><span>' +
        [0, 1].map(function (i) { return '<span class="c' + r.choices[i] + '">' + VH.CHOICE_SHORT[r.choices[i]] + '</span> 🍬' + r.payout[i]; }).join(' · ') + '</span></div>';
    }).join('') : '<p class="muted">아직 없음</p>';
  }
  function tick() {
    var d = new Date(VH.serverNow());
    $('clock').textContent = (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    var ts = document.querySelectorAll('.timer[data-at]');
    for (var i = 0; i < ts.length; i++) {
      var ms = VH.serverNow() - Number(ts[i].getAttribute('data-at'));
      ts[i].textContent = VH.elapsed(ms);
      ts[i].classList.toggle('over', ts[i].getAttribute('data-ph') === 'escape' && data && data.escapeTimeLimitSec && ms > data.escapeTimeLimitSec * 1000);
    }
  }
  tick();
  setInterval(tick, 1000);
  window.addEventListener('resize', function () { if (data) render(); });
})();
</script>
</body>
</html>
