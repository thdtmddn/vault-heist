<!doctype html>
<html lang="ko" class="wide">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운영진 화면 모음 · 금고 털이 작전</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>💰 금고 털이 작전 · 운영진 화면</h1>
  <p class="muted">각 담당자 기기에서 아래 주소를 열거나 QR을 찍으세요. 같은 와이파이(또는 핫스팟)에 연결되어 있어야 해요.</p>
  <div class="links" id="links"></div>
</div>
<script>
(function () {
  var roles = [
    ['lobby', '🧾 로비 매니저', '팀 등록 · 대기열 · 시작 · 단계 관리 (PIN)'],
    ['catcher', '🚓 잡는 사람', '금고 열리면 체포 (PIN)'],
    ['investigator', '🕵️ 수사관', '용의자 A/B와 채팅 심문 (PIN)'],
    ['board', '📊 전체 현황판', '큰 화면용 · PIN 없음'],
    ['', '🔒 조사실 (용의자)', '조사실 태블릿 · 참가 코드 입력'],
  ];
  fetch('/api/info').then(function (r) { return r.json(); }).then(function (i) {
    document.getElementById('links').innerHTML = roles.map(function (r) {
      var url = i.baseUrl + '/' + r[0];
      return '<a class="card" href="/' + r[0] + '"><b>' + r[1] + '</b><div class="muted">' + r[2] + '</div>' +
        '<img class="qr" alt="QR" src="/api/qr.svg?path=' + r[0] + '"><div class="center muted" style="font-size:15px;word-break:break-all">' + url + '</div></a>';
    }).join('');
  });
})();
</script>
</body>
</html>
