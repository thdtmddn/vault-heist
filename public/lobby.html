<!doctype html>
<html lang="ko" class="lobby">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로비 매니저 · 금고 털이 작전</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🧾 로비 매니저</h1>
    <div class="right">
      <a class="btn small ghost" href="/catcher">잡는 사람</a>
      <a class="btn small ghost" href="/investigator">수사관</a>
      <a class="btn small ghost" href="/board" target="_blank">현황판</a>
      <button class="btn small light" id="logout" type="button">로그아웃</button>
    </div>
  </div>
  <div class="layout-lobby">
    <div class="lobby-side">
      <form id="regForm" class="card" autocomplete="off">
        <h2>➕ 팀 등록</h2>
        <label for="teamName">팀 이름 또는 번호</label>
        <input id="teamName" class="big" maxlength="20" placeholder="비워 두면 자동 번호">
        <div class="row2">
          <div><label for="memA">참가자 A (선택)</label><input id="memA" class="big" maxlength="12" placeholder="이름"></div>
          <div><label for="memB">참가자 B (선택)</label><input id="memB" class="big" maxlength="12" placeholder="이름"></div>
        </div>
        <button class="btn block gold big" type="submit">대기열에 추가</button>
      </form>
      <div class="card">
        <h2>⏳ 대기열 <span id="qCount" class="muted"></span></h2>
        <div id="queue"></div>
      </div>
      <div class="card lobby-stats">
        <h2>📊 누적</h2>
        <div id="stats" class="muted"></div>
        <button class="btn small light" id="resetStats" type="button" style="margin-top:8px">누적 통계 초기화</button>
      </div>
    </div>
    <div>
      <div class="card" style="margin-top:12px">
        <h2>🎬 진행 중인 세션</h2>
        <div id="active" class="grid"></div>
      </div>
      <div class="card">
        <h3>📡 접속 주소</h3>
        <div id="addr" class="muted"></div>
      </div>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/lobby.js"></script>
</body>
</html>
